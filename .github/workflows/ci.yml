name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: lint + test + build
    runs-on: ubuntu-latest

    # Nenhum step escreve no repositório (só clona, instala e roda) — sem este
    # bloco o GITHUB_TOKEN herdaria o default do repo, que pode ser write.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Medido no painel da Vercel: produção roda Node 24.x. O .nvmrc na
          # raiz é a fonte única (local, CI e deploy) — node-version-file o lê,
          # então esta escolha não pode divergir dele por esquecimento.
          # Não é cosmético: o npm que vem embutido decide se o `npm ci` aceita
          # o lock. O Node 24.19 embarca npm 11.17.0 — e foi com ele, não com o
          # npm local, que o package-lock.json deste commit foi regerado.
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        # HUSKY=0 impede que o "prepare" (husky) instale git hooks no runner.
        # O arquivo .husky/pre-push permanece intacto no repositório — o hook
        # continua sendo o feedback rápido local; o CI é a camada não-pulável.
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
